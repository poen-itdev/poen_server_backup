<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회사소개서</title>
    <link rel="stylesheet" href="base/style/style.css" />
    <style>
      body {
	  background-color: #fff;
	  padding:20px;
      }
            .tit {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      h2 {
        font-size: 1.2rem;
        font-weight: normal;
      }
      .download-links {
        margin: 20px 0;
      }
      .download-links li {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
        margin: 5% auto 0;
        gap: 15px;
        align-items: center;
        background-color: #e9e9e9;
        border-radius: 8px;
        padding: 20px;
      }
      .download-links a {
        color: #000;
        text-decoration: none;
        display: flex;
        flex-direction: column;
      }
      .download-links a:hover {
        color: #003399;
      }
      .download-links img {
        width: 30px;
        height: 30px;
      }
      .download-links p {
        font-size: 1rem;
      }

      .download-links span {
        font-size: 0.8rem;
      }

    </style>
  </head>

  <body>
    <section>
	     <div class="wrap">
        <div class="tit">
          <img src="base/img/poen.png" style="width: 78px; height: 28px" />
          <h2>
            원하시는 언어의 회사소개서를<br />
            다운로드 해주세요.
          </h2>
        </div>

        <ul class="download-links">
          <li>
            <img src="/base/img/korea.png" alt="" />
            <a href="/doc/introduction_kr.pdf" download>
              <p>한국어 회사소개서 다운로드</p>
            </a>
          </li>
          <li>
            <img src="/base/img/en.png" alt="" />
            <a href="/">
              <p>영어 회사소개서 다운로드</p>
              <span>English Company Introduction Download</span>
            </a>
          </li>
          <li>
            <img src="/base/img/japan.png" alt="" />
            <a href="/">
              <p>일본어 회사소개서 다운로드</p>
              <span>日本語 会社紹介ダウンロード</span>
            </a>
          </li>
          <li>
            <img src="/base/img/china.png" alt="" />
            <a href="/doc/introduction_zh.pdf" download>
              <p>중국어 회사소개서 다운로드</p>
              <span>中文 公司简介下载</span>
            </a>
          </li>
        </ul>
      </div>
    </section>
  </body>
</html>
