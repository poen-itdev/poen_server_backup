<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=320; user-scalable=no" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <title>Camera</title>
    <link rel="stylesheet" href="base/style/camera.css" />
    <link rel="stylesheet" href="base/style/공정.css" />
    <script src="base/js/camera.js"></script>
  </head>

  <body>
    <section class="cameraAll">
      <div class="process__tit change-tit">
        <h2>이미지 첨부</h2>
      </div>
      <div class="input-group">
        <div class="camera__switch">
          <label for="camera" class="camera">
            <i class="fa-solid fa-camera"></i>
            <span>Camera</span>
            <input type="file" id="camera" capture="camera" accept="image/*" style="display: none" onChange="pic_load(this.files);" multiple />
          </label>
        </div>
        <div class="camera__info">
          <div class="info">
            <label for="_management_id">관리번호</label>
            <input type="text" id="_pic_management_id" size="10" require />
          </div>
          <div class="info">
            <label>공정단계</label>
            <select id="camera_step" name="language" onchange="camera_공정입력_콤보박스(this)">
              <option value="">---</option>
              <option value="입고">입고</option>
              <option value="세척">세척</option>
              <option value="기초검사">기초검사</option>
              <option value="분해조립">분해조립</option>
              <option value="성능검사">성능검사</option>
              <option value="EOL">EOL</option>
              <option value="출하검사">출하검사</option>
              <option value="특이사항">특이사항</option>
              <option value="반품입고">반품입고</option>
              <option value="재출하">재출하</option>
              <option value="완전분해">완전분해</option>
              <option value="폐기">폐기</option>
            </select>

            <label>Slot Number</label>
            <select name="language" onchange="Slot_콤보박스(this)">
              <option value="">---</option>
              <option value="1" id="slot1">Slot 1</option>
              <option value="2" id="slot2">Slot 2</option>
              <option value="3" id="slot3">Slot 3</option>
              <option value="4" id="slot4">Slot 4</option>
              <option value="5" id="slot5">Slot 5</option>
              <option value="6" id="slot6">Slot 6</option>
              <option value="7" id="slot7">Slot 7</option>
              <option value="8" id="slot8">Slot 8</option>
              <option value="9" id="slot9">Slot 9</option>
              <option value="10" id="slot10">Slot 10</option>
              <option value="11" id="slot11">Slot 11</option>
              <option value="12" id="slot12">Slot 12</option>
              <option value="13" id="slot13">Slot 13</option>
              <option value="14" id="slot14">Slot 14</option>
              <option value="15" id="slot15">Slot 15</option>
            </select>
            <button onClick="pic_save();">저장</button>
          </div>
        </div>
      </div>
    </section>
    <div class="camera__img">
      <img id="frame1" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame2" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame3" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame4" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame5" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame6" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame7" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame8" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame9" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame10" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame11" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame12" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame13" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame14" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
      <img id="frame15" class="camera_capture" onerror="this.src='base/img/battery.png'" src="base/img/battery.png" />
    </div>
    <script>
      var camera = document.getElementById("camera");
      var mid = document.getElementById("_pic_management_id");
      var camera_img1 = document.getElementById("frame1");
      var camera_img2 = document.getElementById("frame2");
      var camera_img3 = document.getElementById("frame3");
      var camera_img4 = document.getElementById("frame4");
      var camera_img5 = document.getElementById("frame5");
      var camera_img6 = document.getElementById("frame6");
      var camera_img7 = document.getElementById("frame7");
      var camera_img8 = document.getElementById("frame8");
      var camera_img9 = document.getElementById("frame9");
      var camera_img10 = document.getElementById("frame10");
      var camera_img11 = document.getElementById("frame11");
      var camera_img12 = document.getElementById("frame12");
      var camera_img13 = document.getElementById("frame13");
      var camera_img14 = document.getElementById("frame14");
      var camera_img15 = document.getElementById("frame15");
      var slot1 = document.getElementById("slot1");
      var slot2 = document.getElementById("slot2");
      var slot3 = document.getElementById("slot3");
      var slot4 = document.getElementById("slot4");
      var slot5 = document.getElementById("slot5");
      var slot6 = document.getElementById("slot6");
      var slot7 = document.getElementById("slot7");
      var slot8 = document.getElementById("slot8");
      var slot9 = document.getElementById("slot9");
      var slot10 = document.getElementById("slot10");
      var slot11 = document.getElementById("slot11");
      var slot12 = document.getElementById("slot12");
      var slot13 = document.getElementById("slot13");
      var slot14 = document.getElementById("slot14");
      var slot15 = document.getElementById("slot15");
    </script>
  </body>
</html>
