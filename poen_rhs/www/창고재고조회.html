<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>창고 재고 조회</title>
    <link rel="stylesheet" href="base/style/camera.css" />
    <link rel="stylesheet" href="base/style/공정.css" />
  </head>

  <body>
    <section class="창고 재고 조회">
      <div class="process__tit change-tit">
        <label for="grid_BSA">창고 재고 현황</label>
      </div>
      <div class="data">
        <div class="data-query">
          <div>
            <button onClick="창고_수량집계_year();">Year</button>
            <button onClick="창고_수량집계_month();">Month</button>
          </div>
          <div class="data-check">
            <input type="date" id="_검색일_from" size="40" value="0000-00-00" max="240-12-4" required />
            <span class="tilde">&#126;</span>
            <input type="date" id="_검색일_to" size="40" value="0000-00-00" max="240-12-4" required />&nbsp;
            <button onClick="창고_수량집계();">조회</button>
          </div>
        </div>
      </div>
      <div class="pt">
        <div class="process__tit">
          <label for="grid_마도창고">마도 창고 품번별 재고 현황</label>
        </div>
        <div id="grid_구장창고"></div>
        <br />
        <div class="process__tit">
          <label for="grid_구장창고">구장 창고 품번별 재고 현황</label>
        </div>
        <div id="grid_구장창고"></div>
        <br />
        <div class="process__tit">
          <label for="grid_군포창고">군포 창고 품번별 재고 현황</label>
        </div>
        <div id="grid_군포창고"></div>
        <br />
        <div class="process__tit">
          <label for="grid_제주창고"> 창고 품번별 재고 현황</label>
        </div>
        <div id="grid_제주창고"></div>
      </div>
    </section>
  </body>
</html>
