<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제공 동의서 조회</title>
    <link rel="stylesheet" href="base/style/contract.css" />
    <link rel="stylesheet" href="base/style/style.css" />
    <!-- <link rel="stylesheet" href="base/style/공정.css" /> -->
  </head>

  <body>
    <section class="consent__form">
      <div class="wrap">
        <div class="tit">
          <div class="tit__logo">
            <img src="base/img/poen.png" />
          </div>
          <div class="tit__text">
            <h2>제공 동의서 작성</h2>
            <p>
              아래 작성하기 버튼을 누르시면 해당 동의서를 확인하실 수 있습니다.
              <br />
              동의서 체크, 내용 작성과 날짜, 싸인 완료 후 저장을 눌러주세요.
            </p>
          </div>
        </div>
        <div class="input-group">
          <div class="consent__box">
            <div class="consent__con">
              <div class="img">
                <img src="base/img/confirm.png" />
              </div>
              <p>거래사실 확인서</p>
              <a href="/confirm_doc" class="consent__btn">작성하기</a>
            </div>
          </div>
          <div class="consent__box">
            <div class="consent__con">
              <div class="img">
                <img src="base/img/agreement.png" />
              </div>
              <p>개인정보 동의서</p>
              <a href="/agreement_doc" class="consent__btn">작성하기</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
