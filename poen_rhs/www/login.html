<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  </head>

  <body>
    <section class="Login">
      <div class="container">
        <div class="login-form">
          <div class="title__box">
            <h2>login</h2>
          </div>
          <div class="input-group">
            <ul>
              <li>
                <label for="_id">ID</label>
                <input type="text" id="_id" require />
              </li>
              <li>
                <label for="_passwd">Password</label>
                <input type="password" id="_passwd" require />
              </li>
            </ul>
            <button onClick="login();">
              <p id="login_label">로그인</p>
            </button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
