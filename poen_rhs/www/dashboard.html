<!DOCTYPE html>

  <head>
    <title>Dash Board</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

            <input type="date" id="_검색일_from" size="40" value="0000-00-00" max="240-12-4" required />
            <span>&nbsp; ~ &nbsp;</span>
            <input type="date" id="_검색일_to" size="40" value="0000-00-00" max="240-12-4" required />
            <button onClick="dashboard_조회();" class="check-btn">조회</button>
          </div>
        </div>
        <div class="con__body">
          <div class="inner">
            <div class="contents">
              <div class="item d1" id="입고">
                <div class="icon">
                  <img src="base/img/cargo.png" alt="입고" />
                </div>
                <h3>입고</h3>
                <span id="num1"></span>
                <span id="num1t"></span>
              </div>
              <div class="item d2" id="세척">
                <div class="icon">
                  <img src="base/img/clean.png" alt="세척" />
                </div>
                <h3>세척</h3>
                <span id="num2"></span>
                <span id="num2t"></span>
              </div>
              <div class="item d3" id="기초">
                <div class="icon">
                  <img src="base/img/quality-control.png" alt="기초검사" />
                </div>
                <h3>기초검사</h3>
                <span id="num3"></span>
                <span id="num3t"></span>
              </div>
              <div class="item d2" id="분해">
                <div class="icon">
                  <img src="base/img/operation.png" alt="분해조립" />
                </div>
                <h3>분해조립</h3>
                <span id="num4"></span>
                <span id="num4t"></span>
              </div>
              <div class="item d3" id="성능">
                <div class="icon">
                  <img src="base/img/battery-status.png" alt="성능검사" />
                </div>
                <h3>성능검사</h3>
                <span id="num5"></span>
                <span id="num5t"></span>
              </div>
              <div class="item d1" id="EOL">
                <div class="icon">
                  <img src="base/img/eol.png" alt="EOL" />
                </div>
                <h3>EOL</h3>
                <span id="num6"></span>
                <span id="num6t"></span>
              </div>
              <div class="item d2" id="출하검사">
                <div class="icon">
                  <img src="base/img/oqc.png" alt="출하검사" />
                </div>
                <h3>출하검사</h3>
                <span id="num7"></span>
                <span id="num7t"></span>
              </div>
              <div class="item d3" id="출하">
                <div class="icon">
                  <img src="base/img/outgoing.png" alt="출하" />
                </div>
                <h3>출하</h3>
                <span id="num8"></span>
                <span id="num8t"></span>
              </div>
              <!--<div style="background-color: navy; width: 23%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
                                              <h3 style="color:#fff;">마도</h3>
                                              <span id="num6" style="font-size:3vw; color:#fff;"></span>
                                            </div>
                                            <div style="background-color: gray; width: 23%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
                                              <h3 style="color:#fff;">구장</h3>
                                              <span id="num7" style="font-size:3vw; color:#fff;"></span>
                                            </div>-->
              <!--<div style="background-color: black; width: 23%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
                                              <h3 style="color:#fff;">폐기</h3>
                                              <span id="num9" style="font-size:3vw; color:#fff;"></span>
                                            </div>-->
            </div>
          </div>
        </div>

        <div class="process">
          <div class="process__tit">
            <label id="공정라벨" for="grid_공정"></label>
          </div>
          <div id="grid_공정" class="bsa-title"></div>
        </div>
      </div>
    </section>
